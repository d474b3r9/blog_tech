site:
  name: DataStart
  site: 'https://datastart.fr'
  base: '/'
  trailingSlash: false


# Default SEO metadata
metadata:
  title:
    default: DataStart
    template: '%s — DataStart'
  description: "Articles, retours d'expériences et veille technique."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: DataStart
    locale: fr_FR
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: fr
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"
    # Umami: cookieless, privacy-friendly, tracks UTM params by default.
    # To enable: create a website on cloud.umami.is (or your self-hosted instance) and paste its ID in websiteId.
    # Self-hosted: set scriptUrl to your instance script. domains (optional): "example.com" to ignore other hosts.
    umami:
      websiteId: null # or "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      scriptUrl: 'https://cloud.umami.is/script.js'
      domains: 'datastart.fr'

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
