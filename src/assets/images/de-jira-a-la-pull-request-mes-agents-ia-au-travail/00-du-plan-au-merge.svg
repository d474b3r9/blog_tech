<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Du plan au merge : mon travail avec les agents</title>
<desc id="desc">Je prépare le plan, l'agent écrit tout le code, puis je relis et fais corriger avant le merge. Avec l'équipe, j'enrichis les conventions, la documentation de modélisation, les skills et les hooks à partir des défauts observés.</desc>
