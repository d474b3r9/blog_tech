<text x="72" y="469" fill="#eaf0ff" font-size="27" font-weight="700">Avec l’équipe, j’enrichis le harnais après les relectures</text>
<text x="72" y="512" fill="#adc1df" font-size="24">Conventions et documentation de modélisation · Skills · Hooks</text>
<text x="72" y="547" fill="#adc1df" font-size="22">On transforme les défauts observés en consignes et en contrôles.</text>
