<text x="72" y="310" fill="#adc1df" font-size="22">Données et modélisation</text>
<text x="72" y="346" fill="#adc1df" font-size="22">Conventions à respecter</text>
<text x="452" y="216" fill="#80a8f5" font-size="24" font-weight="700">L’AGENT ÉCRIT</text>
<text x="452" y="270" fill="#eaf0ff" font-size="24">Le code du développement</text>
<text x="452" y="310" fill="#adc1df" font-size="22">Avec les instructions</text>
<text x="452" y="346" fill="#adc1df" font-size="22">et les outils disponibles</text>
<text x="832" y="216" fill="#e7b568" font-size="24" font-weight="700">JE RELIS ET VALIDE</text>
<text x="832" y="270" fill="#eaf0ff" font-size="24">Je fais corriger le code</text>
<text x="832" y="310" fill="#adc1df" font-size="22">Cohérence avec l’existant</text>
<text x="832" y="346" fill="#adc1df" font-size="22">Décision avant le merge</text>
