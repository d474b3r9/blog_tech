  <text x="20" y="540" font-size="13" fill="#475569">Vitesse et contexte : mesurés sur ma machine (RTX 3080 Ti, 32 Go de DDR4). Contexte : palier le plus haut testé qui garde 20 tok/s ou plus (seuil de mon choix), échelle logarithmique.</text>
  <text x="20" y="558" font-size="13" fill="#475569">Justesse chez moi : 280 questions MMLU-Pro en réponse directe, sur mes quantifications (hasard à 10 %, marge d'erreur d'environ 3 points : sous 6 points d'écart, pas de classement fiable).</text>
  <text x="20" y="576" font-size="13" fill="#475569">Justesse Epoch : GPQA Diamond avec raisonnement, modèles d'origine (hasard à 25 %, marge de 2 à 3 points). Rang parmi les 5 modèles mesurés. Source : epoch.ai/data, licence CC BY 4.0.</text>
  <text x="20" y="594" font-size="13" fill="#475569">Hachuré : non mesuré. GLM-4.7-Flash n'a pas pu passer mon test faute de mémoire. Les deux mesures de justesse n'ont ni la même échelle ni le même protocole.</text>
