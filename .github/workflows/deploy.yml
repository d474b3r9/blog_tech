name: Deploy to GitHub Pages

# Déclencheurs :
# - push sur main : déploiement immédiat ;
# - workflow_dispatch : bouton « Run workflow », pour publier ou relancer à la main ;
# - schedule : une fois par jour à 4h (heure de Paris), pour faire sortir un article dont le jour
#   de `publishDate` est arrivé. GitHub gère le passage heure d'été et heure d'hiver grâce à
#   `timezone`. Minute 3 plutôt que 0 : le début d'heure est chargé et les exécutions peuvent
#   y être retardées.

on:
  push:
    branches: [main]
  schedule:
    - cron: '3 4 * * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
